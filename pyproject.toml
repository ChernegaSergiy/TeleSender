[project]
name = "TeleSender"
version = "1.0.0"
description = "Modular Telegram UserBot with plugins, task scheduler and web interface."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-CSSM-Unlimited-2.0" }
authors = [
    { name = "ChernegaVitaliy" }
]
keywords = ["telegram", "userbot", "telethon", "plugins", "scheduler", "automation"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "telethon>=1.36.0",
    "aiohttp>=3.9.0",
    "aiohttp-jinja2>=1.6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
TeleSender = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*", "core*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
